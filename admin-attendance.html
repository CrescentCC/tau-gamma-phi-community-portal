<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Monitoring | Tau Gamma Phi Community Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">

  <script src="auth.js"></script>
  <script>
    (function () {
      var session = getSession();
      if (!session || session.role !== "admin") {
        window.location.replace("login.html");
      }
    })();
  </script>
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-brand">
        <img src="assets/logo.png" class="logo">
        <span class="admin-brand-text">TGP PORTAL</span>
      </div>

      <nav class="admin-nav">
        <a href="admin.html" class="admin-nav-link">
          <i class="fa-solid fa-house"></i> Dashboard
        </a>
        <a href="admin-announcements.html" class="admin-nav-link">
          <i class="fa-solid fa-pen"></i> Publish Announcement
        </a>
        <a href="admin-events.html" class="admin-nav-link">
          <i class="fa-regular fa-calendar-check"></i> Event Management
        </a>
        <a href="admin-gallery.html" class="admin-nav-link">
          <i class="fa-solid fa-images"></i> Gallery Management
        </a>
        <a href="admin-attendance.html" class="admin-nav-link active">
          <i class="fa-solid fa-tablet-screen-button"></i> Attendance Monitoring
        </a>
        <button type="button" class="admin-nav-link admin-logout-link" id="adminLogoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="admin-hamburger" id="adminHamburgerBtn" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="admin-user">
          <span id="adminUsernameLabel">Admin</span>
          <div class="admin-user-icon"><i class="fa-solid fa-user"></i></div>
        </div>
      </header>

      <main class="admin-content">
        <h1 class="admin-page-title">ATTENDANCE MONITORING</h1>

        <div class="select-wrapper attendance-event-select-wrap">
          <select class="event-select" id="attendanceEventSelect">
            <option value="" selected disabled>-- Select Event --</option>
          </select>
        </div>

        <div class="admin-stats-grid attendance-stats-grid">
          <div class="admin-stat-card">
            <span class="stat-number" id="attTotalMembers">0</span>
            <span class="stat-label">Total Members</span>
          </div>
          <div class="admin-stat-card">
            <span class="stat-number" id="attPresent">0</span>
            <span class="stat-label">Present</span>
          </div>
          <div class="admin-stat-card">
            <span class="stat-number" id="attAbsent">0</span>
            <span class="stat-label">Absent</span>
          </div>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody">
              <tr><td colspan="3" class="admin-table-empty">Select an event to view attendance.</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div class="admin-overlay" id="adminOverlay" hidden></div>

  <script src="admin-data.js"></script>
  <script defer src="admin.js"></script>
  <script defer src="admin-attendance.js"></script>
</body>
</html>
