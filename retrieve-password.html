<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retrieve Password | Tau Gamma Phi Community Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="auth-header">
    <img src="assets/logo.png" class="logo">
    <div class="brand-text">
      <span class="brand-title-dark">TAU GAMMA PHI</span>
      <span class="brand-subtitle-dark">Conception Chapter</span>
    </div>
  </header>

  <section class="auth-page">
    <form class="auth-form" id="retrieveForm" novalidate>

      <div class="signup-step active" data-step="1">
        <h1 class="auth-title">Retrieve Password</h1>
        <p class="auth-subtitle">Enter your phone number or recovery email</p>

        <input type="text" class="auth-input" id="identifierInput" placeholder="Phone number or email" required>
        <p class="auth-error" id="identifierError" hidden></p>

        <button type="button" class="auth-submit-btn step-next-btn" data-next="2">Send verification</button>
      </div>

      <div class="signup-step" data-step="2">
        <h1 class="auth-title">Create new password</h1>

        <input type="password" class="auth-input" id="newPassword" placeholder="New password" required>
        <input type="password" class="auth-input" id="confirmNewPassword" placeholder="Confirm password" required>
        <p class="auth-error" id="newPasswordError" hidden></p>

        <button type="submit" class="auth-submit-btn">Confirm</button>
      </div>

    </form>
  </section>

  <footer class="footer">
    <p>&copy; 2026 Tau Gamma Phi Conception Chapter</p>
  </footer>

  <script src="auth.js"></script>
  <script defer src="retrieve-password.js"></script>
</body>
</html>

  <script defer src="retrieve-password.js"></script>
</body>
</html>
