<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance | Tau Gamma Phi Community Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar-top">
      <div class="navbar-brand">
        <img src="assets/logo.png" class="logo">
        <div class="brand-text">
          <span class="brand-title">Tau Gamma Phi</span>
          <span class="brand-subtitle">Conception Chapter</span>
        </div>
      </div>

      <div class="navbar-actions">
        <a href="support.html" class="support-btn support-btn-mobile">Support us</a>
        <a href="support.html" class="support-btn support-btn-desktop">Support us</a>

        <button class="hamburger" id="hamburgerBtn" aria-label="Open navigation">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>

    <nav class="nav-dropdown" id="navLinks">
      <div class="nav-links-grid">
        <a href="index.html#home">Home</a>
        <a href="attendance.html">Attendance</a>
        <a href="index.html#about">About us</a>
        <a href="index.html#programs">Programs</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#announcements">Announcements</a>
        <a href="gallery.html">Gallery</a>
        <a href="index.html#contact">Contact us</a>
        <a href="profile.html" class="nav-link-full">Profile</a>
      </div>

      <button class="nav-toggle-chevron" id="chevronBtn" aria-label="Close navigation">
        <i class="fa-solid fa-chevron-up"></i>
      </button>
    </nav>
  </header>

  <section class="attendance-page">
    <h1 class="attendance-heading">EVENT ATTENDANCE</h1>

    <div class="attendance-card">
      <div class="select-wrapper">
        <select class="event-select" id="eventSelect">
          <option value="" selected disabled>-- Select Event --</option>
          <option value="outreach">Community Outreach Program - Sept 26, 2026</option>
          <option value="assembly">General Assembly</option>
          <option value="seminar">Leadership Seminar</option>
        </select>
      </div>

      <button type="button" class="time-btn time-in-btn" id="timeInBtn">Time-In</button>
      <button type="button" class="time-btn time-out-btn" id="timeOutBtn">Time-Out</button>
    </div>
  </section>

  <div class="face-modal" id="faceModal" hidden>
    <div class="face-modal-content">
      <p class="face-modal-title" id="faceModalTitle">Face Verification</p>

      <div class="face-video-wrap">
        <video id="faceVideo" autoplay muted playsinline></video>
        <canvas id="faceCanvas"></canvas>
        <img id="capturedPhoto" class="captured-photo" alt="Captured photo" hidden>
      </div>

      <p class="face-status" id="faceStatus">Starting camera...</p>

      <div class="face-actions" id="faceActions" hidden>
        <button type="button" class="face-retake-btn" id="faceRetakeBtn">Retake</button>
        <button type="button" class="face-confirm-btn" id="faceConfirmBtn">Confirm</button>
      </div>

      <button type="button" class="face-cancel-btn" id="faceCancelBtn">Cancel</button>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Tau Gamma Phi Fraternity. All rights reserved.</p>
  </footer>

  <script src="main.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script defer src="attendance.js"></script>
</body>
</html>
