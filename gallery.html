<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Tau Gamma Phi Community Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar-top">
      <div class="navbar-brand">
        <img src="assets/logo.png" class="logo">
        <div class="brand-text">
          <span class="brand-title">Tau Gamma Phi</span>
          <span class="brand-subtitle">Conception Chapter</span>
        </div>
      </div>

      <div class="navbar-actions">
        <a href="support.html" class="support-btn support-btn-mobile">Support us</a>
        <a href="support.html" class="support-btn support-btn-desktop">Support us</a>

        <button class="hamburger" id="hamburgerBtn" aria-label="Open navigation">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>

    <nav class="nav-dropdown" id="navLinks">
      <div class="nav-links-grid">
        <a href="index.html#home">Home</a>
        <a href="attendance.html">Attendance</a>
        <a href="index.html#about">About us</a>
        <a href="index.html#programs">Programs</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#announcements">Announcements</a>
        <a href="gallery.html">Gallery</a>
        <a href="index.html#contact">Contact us</a>
        <a href="profile.html" class="nav-link-full">Profile</a>
      </div>

      <button class="nav-toggle-chevron" id="chevronBtn" aria-label="Close navigation">
        <i class="fa-solid fa-chevron-up"></i>
      </button>
    </nav>
  </header>

  <section class="gallery-page">
    <h1 class="section-title">GALLERY</h1>

    <div class="gallery-filters">
      <button type="button" class="filter-btn active" data-filter="all">ALL</button>
      <button type="button" class="filter-btn" data-filter="events">EVENTS</button>
      <button type="button" class="filter-btn" data-filter="programs">PROGRAMS</button>
      <button type="button" class="filter-btn" data-filter="activities">ACTIVITIES</button>
    </div>

    <div class="gallery-grid">
      <div class="gallery-item" data-category="activities">
        <img src="assets/landing-page.jpg" alt="Gallery photo">
      </div>
      <div class="gallery-item" data-category="events">
        <img src="assets/event-photo.jpg" alt="Gallery photo">
      </div>
      <div class="gallery-item" data-category="programs">
        <img src="assets/Program-1.jpg" alt="Gallery photo">
      </div>
      <div class="gallery-item" data-category="programs">
        <img src="assets/Program-2.jpg" alt="Gallery photo">
      </div>
      <div class="gallery-item" data-category="events">
        <img src="assets/Program-3.jpg" alt="Gallery photo">
      </div>
      <div class="gallery-item" data-category="activities">
        <img src="assets/Program-4.jpg" alt="Gallery photo">
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 Tau Gamma Phi Fraternity. All rights reserved.</p>
  </footer>

  <script src="main.js"></script>
  <script defer src="gallery.js"></script>
</body>
</html>
