<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Management | Tau Gamma Phi Community Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">

  <script src="auth.js"></script>
  <script>
    (function () {
      var session = getSession();
      if (!session || session.role !== "admin") {
        window.location.replace("index.html");
      }
    })();
  </script>
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-brand">
        <img src="assets/logo.png" class="logo">
        <span class="admin-brand-text">TGP PORTAL</span>
      </div>

      <nav class="admin-nav">
        <a href="admin.html" class="admin-nav-link">
          <i class="fa-solid fa-house"></i> Dashboard
        </a>
        <a href="admin-announcements.html" class="admin-nav-link">
          <i class="fa-solid fa-pen"></i> Publish Announcement
        </a>
        <a href="admin-events.html" class="admin-nav-link active">
          <i class="fa-regular fa-calendar-check"></i> Event Management
        </a>
        <a href="admin-gallery.html" class="admin-nav-link">
          <i class="fa-solid fa-images"></i> Gallery Management
        </a>
        <a href="admin-attendance.html" class="admin-nav-link">
          <i class="fa-solid fa-tablet-screen-button"></i> Attendance Monitoring
        </a>
        <button type="button" class="admin-nav-link admin-logout-link" id="adminLogoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="admin-hamburger" id="adminHamburgerBtn" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="admin-user">
          <span id="adminUsernameLabel">Admin</span>
          <div class="admin-user-icon"><i class="fa-solid fa-user"></i></div>
        </div>
      </header>

      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">EVENT MANAGEMENT</h1>
          <button type="button" class="admin-primary-btn" id="addEventBtn">+ Add Event</button>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Event Title</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="eventsTableBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div class="admin-overlay" id="adminOverlay" hidden></div>

  <div class="admin-modal" id="eventModal" hidden>
    <div class="admin-modal-content">
      <h2 class="admin-modal-title" id="eventModalTitle">Add Event</h2>

      <form id="eventForm">
        <input type="text" class="admin-input" id="eventTitleInput" placeholder="Event title" required>
        <input type="date" class="admin-input" id="eventDateInput" required>
        <select class="admin-input" id="eventStatusInput" required>
          <option value="Upcoming">Upcoming</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Completed">Completed</option>
        </select>

        <div class="announcement-photo-row">
          <div class="announcement-photo-preview" id="eventPhotoPreview">
            <span>No image selected</span>
          </div>
          <label class="admin-secondary-btn">
            Upload Photo
            <input type="file" accept="image/*" id="eventPhotoInput" hidden>
          </label>
        </div>

        <div class="admin-modal-actions">
          <button type="button" class="admin-secondary-btn" id="cancelEventBtn">Cancel</button>
          <button type="submit" class="admin-primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin-data.js"></script>
  <script defer src="admin.js"></script>
  <script defer src="admin-events.js"></script>
</body>
</html>
