<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tau Gamma Phi Community Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="auth-header">
    <img src="tau-gamma-phi-community-portal/assets/logo.png" class="logo">
    <div class="brand-text">
      <span class="brand-title-dark">TAU GAMMA PHI</span>
      <span class="brand-subtitle-dark">Conception Chapter</span>
    </div>
  </header>

  <section class="auth-page">
    <form class="auth-form" id="loginForm">
      <input type="text" class="auth-input" id="loginUsername" placeholder="Username" required>
      <input type="password" class="auth-input" id="loginPassword" placeholder="Password" required>

      <a href="retrieve-password.html" class="forgot-password-link">Forgot Password?</a>

      <p class="auth-success" id="loginSuccess" hidden>Account created! Please log in.</p>
      <p class="auth-error" id="loginError" hidden></p>

      <button type="submit" class="auth-submit-btn">LOG IN</button>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
  </section>

  <footer class="footer">
    <p>&copy; 2026 Tau Gamma Phi Conception Chapter</p>
  </footer>

  <script src="auth.js"></script>
  <script defer src="login.js"></script>
</body>
</html>
